    <!-- Aplica o idioma salvo (ou o do navegador) antes da primeira pintura. -->
    <script>
      (function () {
        var lang = null;
        try {
          lang = localStorage.getItem('lang');
        } catch (e) {}
        if (lang !== 'pt' && lang !== 'en') {
          lang = /^pt/i.test(navigator.language || '') ? 'pt' : 'en';
        }
        document.documentElement.setAttribute('lang', lang === 'pt' ? 'pt-BR' : 'en');
      })();
    </script>

    <div id="root"></div>
